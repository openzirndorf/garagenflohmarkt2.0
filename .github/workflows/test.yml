name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check app scripts

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx biome check src vite.config.ts vitest.config.ts

  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Bewusst "-p tsconfig.json --noEmit" (wie im "build"-Skript), NICHT "-b" -
      # tsc im Build-Modus (-b) hat hier schon einmal versehentlich .js-Dateien
      # neben die .tsx-Quellen geschrieben.
      - run: npx tsc -p tsconfig.json --noEmit

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vitest --run

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flohmarkt
          POSTGRES_PASSWORD: flohmarkt
          POSTGRES_DB: flohmarkt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flohmarkt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://flohmarkt:flohmarkt@localhost:5432/flohmarkt_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest app/tests -v --ignore=app/tests/test_stands_public_allowlist.py --ignore=app/tests/test_stands_tokens.py --ignore=app/tests/test_logging_no_pii.py --ignore=app/tests/test_deletion_job.py

  # Eigener, nicht überspringbarer Job für die Datenschutz-Tests (Positivliste,
  # Token-Lifecycle, PII-in-Logs, Löschjob) - als Required Status Check in den
  # Branch-Protection-Regeln von main eintragen, damit kein Merge möglich ist,
  # der eine dieser Eigenschaften verletzt.
  privacy-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flohmarkt
          POSTGRES_PASSWORD: flohmarkt
          POSTGRES_DB: flohmarkt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flohmarkt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://flohmarkt:flohmarkt@localhost:5432/flohmarkt_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: >
          python -m pytest app/tests -v
          app/tests/test_stands_public_allowlist.py
          app/tests/test_stands_tokens.py
          app/tests/test_logging_no_pii.py
          app/tests/test_deletion_job.py
