name: Deploy

# Deployt Backend UND Frontend in einem Rutsch: das Docker-Image baut das
# Vite-Frontend in einer eigenen Stage und kopiert dessen dist/ mit hinein
# (siehe Dockerfile, app/main.py) - ein Container statt Backend (Scaleway)
# und Frontend (bisher GitHub Pages) getrennt zu hosten.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/**"
      - "migrations/**"
      - "frontend/**"
      - "Dockerfile"
      - "pyproject.toml"
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Nicht überspringbar: kein Deploy ohne grüne Tests, insbesondere die
  # Datenschutz-Tests aus app/tests/test_stands_public_allowlist.py &co.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flohmarkt
          POSTGRES_PASSWORD: flohmarkt
          POSTGRES_DB: flohmarkt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flohmarkt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://flohmarkt:flohmarkt@localhost:5432/flohmarkt_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check app scripts
      - run: python -m pytest app/tests -v

  # Ehemals eigener Workflow deploy-frontend.yml (GitHub Pages) - jetzt Teil
  # dieses gemeinsamen Deploys, blockiert build-and-push wie zuvor bei
  # eigenständigem Frontend-Deploy.
  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npx vitest --run

  build-and-push:
    needs: [test, frontend-test]
    runs-on: ubuntu-latest
    outputs:
      sha_tag: ${{ steps.tags.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Scaleway Registry
        uses: docker/login-action@v3
        with:
          registry: rg.fr-par.scw.cloud
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - id: tags
        run: echo "sha_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      # :latest bleibt als gewohnter Zeiger bestehen; der SHA-Tag macht das
      # tatsächlich deployte Image eindeutig identifizierbar (für den
      # Rollback-Schritt unten) statt sich auf das bewegliche :latest zu verlassen.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            rg.fr-par.scw.cloud/openzirndorf-flohmarkt/flohmarkt-api:latest
            rg.fr-par.scw.cloud/openzirndorf-flohmarkt/flohmarkt-api:${{ steps.tags.outputs.sha_tag }}
          # VITE_API_URL bewusst leer: Frontend und Backend teilen sich ab
          # jetzt dieselbe Origin, relative Pfade ("/stands/...") reichen.
          build-args: |
            VITE_API_URL=
            VITE_API_USERNAME=${{ secrets.VITE_API_USERNAME }}
            VITE_API_PASSWORD=${{ secrets.VITE_API_PASSWORD }}
            VITE_STATIC_BASE_URL=${{ vars.VITE_STATIC_BASE_URL }}

  # Wendet ausstehende Migrationen automatisiert an, VOR dem Deploy des neuen
  # Images (das evtl. schon das neue Schema voraussetzt). Migrationsdateien
  # sind bereits über den normalen PR-Prozess reviewt, bevor sie auf main
  # landen - automatisches Anwenden hier ist kein unreviewter Blindflug.
  # Kein Downgrade-Mechanismus: die nummerierten SQL-Dateien sind reine
  # Forward-Migrationen (siehe scripts/migrate.py) - ein "Rollback" bedeutet
  # hier "vorheriges Container-Image erneut deployen" (siehe unten), nicht
  # "Schemaänderung rückgängig machen". Bei einer inkompatiblen Schemaänderung
  # würde ein Image-Rollback allein nicht ausreichen - das ist eine bekannte
  # Grenze von reinen Forward-Migrationen, kein gelöstes Problem.
  migrate:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v2

      - name: DATABASE_URL aus Terraform-State lesen
        working-directory: infra
        run: |
          cat > backend.hcl << EOF
          access_key = "${{ secrets.TF_STATE_ACCESS_KEY }}"
          secret_key = "${{ secrets.TF_STATE_SECRET_KEY }}"
          EOF
          tofu init -backend-config=backend.hcl
          echo "DATABASE_URL=$(tofu output -raw database_connection_string)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m scripts.migrate

  # Produktions-Deploy: pausiert für manuelle Freigabe (GitHub Environment
  # "production" mit Required Reviewers - in den Repo-Settings einzurichten,
  # der Solo-Maintainer kann seine eigene Freigabe erteilen, es braucht
  # keinen zweiten Menschen).
  deploy:
    needs: [build-and-push, migrate]
    runs-on: ubuntu-latest
    environment: production
    outputs:
      previous_image: ${{ steps.capture.outputs.previous_image }}
    steps:
      - name: Scaleway CLI installieren
        # Gepinnte Version statt "curl get.sh | sh" (installiert immer die
        # jeweils neueste Version zum Laufzeitpunkt): Scaleway hat das
        # Update-Argument für "container update" zwischen Versionen
        # umbenannt (v2.53.0: "registry-image", v2.62.0: "image", exakte
        # Version des Wechsels unbekannt) - ein ungepinntes "latest" ändert
        # sich unter dem Workflow weg, ohne dass sich hier am Code etwas
        # ändert. Bei einer künftigen bewussten CLI-Aktualisierung: Version
        # hier UND im Rollback-Schritt unten gemeinsam anheben, danach
        # "scw container container update --help" auf das dann gültige
        # Argument prüfen, bevor man sich auf denselben Namen verlässt.
        run: |
          curl -sL "https://github.com/scaleway/scaleway-cli/releases/download/v2.62.0/scaleway-cli_2.62.0_linux_amd64" -o scw
          chmod +x scw
          sudo mv scw /usr/local/bin/scw

      - name: Aktuell deploytes Image merken (für Rollback)
        id: capture
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_PROJECT_ID }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_ORGANIZATION_ID }}
          SCW_DEFAULT_REGION: fr-par
        run: |
          current=$(scw container container list name=flohmarkt-api -o json | jq -r '.[0].registry_image')
          echo "previous_image=$current" >> "$GITHUB_OUTPUT"

      - name: Neues Image deployen
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_PROJECT_ID }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_ORGANIZATION_ID }}
          SCW_DEFAULT_REGION: fr-par
        # "update" redeployt automatisch, sobald sich das Image ändert - der
        # scw-CLI kennt kein eigenständiges "deploy"-Subkommando. Das
        # Update-Argument heißt in der oben gepinnten Version "image" (per
        # "scw container container update --help" geprüft) - bei einem
        # künftigen CLI-Versionswechsel hier erneut prüfen, siehe Kommentar
        # beim Installations-Schritt oben.
        run: |
          scw container container update \
            $(scw container container list name=flohmarkt-api -o json | jq -r '.[0].id') \
            image=rg.fr-par.scw.cloud/openzirndorf-flohmarkt/flohmarkt-api:${{ needs.build-and-push.outputs.sha_tag }} \
            region=fr-par

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Health-Check nach dem Deploy
        run: |
          for i in $(seq 1 12); do
            if curl -sf https://api.openzirndorf.de/health | grep -q '"ok":true'; then
              echo "Smoke-Test erfolgreich."
              exit 0
            fi
            echo "Noch nicht bereit, warte 10s ... ($i/12)"
            sleep 10
          done
          echo "Smoke-Test fehlgeschlagen." >&2
          exit 1

      - name: Rollback bei Fehler
        if: failure()
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_PROJECT_ID }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_ORGANIZATION_ID }}
          SCW_DEFAULT_REGION: fr-par
        run: |
          curl -sL "https://github.com/scaleway/scaleway-cli/releases/download/v2.62.0/scaleway-cli_2.62.0_linux_amd64" -o scw
          chmod +x scw
          sudo mv scw /usr/local/bin/scw
          prev="${{ needs.deploy.outputs.previous_image }}"
          # Ohne diese Prüfung hätte ein leerer/"null"-Wert (z.B. weil der
          # Capture-Schritt nichts fand) das Feld live auf den String
          # "null" gesetzt statt auf ein echtes Image - genau das ist
          # einmal live passiert ("image was not found in container
          # registry"). Lieber gar nicht zurückrollen als kaputt zurückrollen.
          if [ -z "$prev" ] || [ "$prev" = "null" ]; then
            echo "::error::Kein gültiges vorheriges Image bekannt (previous_image=\"$prev\") - Rollback übersprungen, manuell prüfen."
            exit 1
          fi
          scw container container update \
            $(scw container container list name=flohmarkt-api -o json | jq -r '.[0].id') \
            image="$prev" \
            region=fr-par
          echo "::error::Deploy fehlgeschlagen, vorheriges Image ($prev) wiederhergestellt."
