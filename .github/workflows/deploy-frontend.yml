name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npx vitest --run

  build:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /garagenflohmarkt2.0/
          VITE_API_URL: https://api.openzirndorf.de
          VITE_API_USERNAME: ${{ secrets.VITE_API_USERNAME }}
          VITE_API_PASSWORD: ${{ secrets.VITE_API_PASSWORD }}
          # Nicht geheim (öffentlicher Bucket) - als Repo-Variable statt
          # Secret gepflegt: Settings → Secrets and variables → Actions → Variables.
          # Leer lassen ist sicher: api.ts fällt dann auf die Live-API zurück.
          VITE_STATIC_BASE_URL: ${{ vars.VITE_STATIC_BASE_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  # Pausiert für manuelle Freigabe wie beim Backend-Deploy (GitHub Environment
  # "production" mit Required Reviewers) - eigener Zwischenschritt, damit der
  # eigentliche Deploy-Job weiterhin im von actions/deploy-pages erwarteten
  # Environment "github-pages" läuft (sonst verliert man die Pages-spezifische
  # Anzeige in der GitHub-UI).
  approve-production:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "Freigegeben für Produktions-Deploy."

  deploy:
    needs: approve-production
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
